<svg viewBox="0 0 1280 116" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="03 / TELEMETRY — System Telemetry">
  <defs>
    <linearGradient id="ln_03_l" x1="0" x2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.35" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pulse-ring { animation: ring 2.2s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .pulse-dot, .pulse-ring, .sh { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .pulse-ring { opacity: 0; }
    }
  </style>

  <text x="4" y="34" class="mono" font-size="14" font-weight="700" fill="#0284c7" letter-spacing="4">03 / TELEMETRY</text>
  <text x="0" y="86" class="mono" font-size="42" font-weight="700" fill="#0b0c10" letter-spacing="-1">System Telemetry</text>
  <text x="1276" y="86" class="mono" font-size="16" fill="#5d6270" text-anchor="end">Hardware acceleration & operational metrics</text>
  <rect x="0" y="108" width="1280" height="2" fill="url(#ln_03_l)"/>
</svg>