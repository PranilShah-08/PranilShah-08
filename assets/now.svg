<svg viewBox="0 0 1280 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Now Status Strip">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="75" rx="38" fill="#ffffff" stroke="rgba(11,12,16,0.09)"/>
  
  <!-- NOW pill -->
  <rect x="14" y="14" width="96" height="48" rx="24" fill="#0284c7"/>
  <text x="62" y="44" class="mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">NOW</text>
  
  <!-- Pulsing green status dot -->
  <circle cx="140" cy="38" r="5" fill="#22c55e"/>
  <circle class="pulse-dot" cx="140" cy="38" r="5" fill="#22c55e"/>
  
  <text x="162" y="44" class="mono" font-size="16" fill="#0b0c10">Exploring Multi-Agent Containment &amp; Zero-Drift Steering • 4 Flagship Frameworks Active</text>
  <text x="1252" y="44" class="mono" font-size="13" fill="#5d6270" text-anchor="end" letter-spacing="1.5">UPDATED LIVE</text>
</svg>