<svg viewBox="0 0 1280 490" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flagship projects by Pranil Shah">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pulse-ring { animation: ring 2.2s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .pulse-dot, .pulse-ring, .sh { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .pulse-ring { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="489" rx="24" fill="#ffffff" stroke="rgba(11,12,16,0.08)"/>
  <g class="mono">
    <!-- Project 01 -->
    <g class="rise a1" transform="translate(0 10)">
      <text fill="#0b0c10" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">01 / BREAK-YOUR-MODEL</text>
      <text fill="#5d6270" font-size="13" x="48" y="52">Autonomous LLM representation abliteration &amp; directional safety steering framework.</text>
      <text fill="#8b909f" font-size="13" x="48" y="72">Zero-drift arbitrary-rank ablation (ARA), hyperspherical row-norm invariance, and Pareto TPE optimization.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · PYTORCH · REPRESENTATION ENGINEERING · OPTUNA · MPS / CUDA</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#e2ded4" stroke-width="1"/>
    </g>

    <!-- Project 02 -->
    <g class="rise a2" transform="translate(0 130)">
      <text fill="#0b0c10" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">02 / NESTED-ADVERSARIAL-CONTAINMENT</text>
      <text fill="#5d6270" font-size="13" x="48" y="52">Empirical evaluation framework for multi-agent safety and adversarial breakout dynamics.</text>
      <text fill="#8b909f" font-size="13" x="48" y="72">Stress-tests autonomous containment barriers between interacting LLMs under operational survival pressure.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · MULTI-AGENT · AI SAFETY · GAME THEORY · ALIGNMENT</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#e2ded4" stroke-width="1"/>
    </g>

    <!-- Project 03 -->
    <g class="rise a3" transform="translate(0 250)">
      <text fill="#0b0c10" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">03 / ONIX-COUNCIL</text>
      <text fill="#5d6270" font-size="13" x="48" y="52">Collaborative intelligence platform where multiple language models deliberate and reach consensus.</text>
      <text fill="#8b909f" font-size="13" x="48" y="72">Synthesizes distributed multi-perspective reasoning into high-confidence verified outputs via chairman protocol.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · LLMS · MULTI-AGENT CONSENSUS · DELIBERATION PROTOCOL</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#e2ded4" stroke-width="1"/>
    </g>

    <!-- Project 04 -->
    <g class="rise a4" transform="translate(0 370)">
      <text fill="#0b0c10" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">04 / CODECRITIC</text>
      <text fill="#5d6270" font-size="13" x="48" y="52">Autonomous senior software engineer agent reviewing implementations for architecture quality.</text>
      <text fill="#8b909f" font-size="13" x="48" y="72">Audits pull requests for failure cases, scalability, readability, maintainability, and hidden edge cases.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · LLMS · STATIC ANALYSIS · CODE REVIEW AGENT</text>
    </g>
  </g>
</svg>