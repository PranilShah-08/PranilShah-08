<svg viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flagship projects showcase">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="479" rx="24" fill="#ffffff" stroke="rgba(11,12,16,0.09)"/>
  <g class="mono">
    <!-- Project 01: Break-Your-Model (No MPS/CUDA) -->
    <g transform="translate(0 10)">
      <rect x="48" y="18" width="6" height="24" rx="3" fill="#0284c7"/>
      <text fill="#0b0c10" font-size="18" font-weight="700" x="64" y="36">01 / BREAK-YOUR-MODEL</text>
      <text fill="#5d6270" font-size="13" x="48" y="66">Autonomous LLM representation abliteration &amp; directional safety steering framework.</text>
      <text fill="#8b909f" font-size="13" x="48" y="86">Zero-drift arbitrary-rank ablation (ARA), hyperspherical row-norm invariance, and Pareto TPE optimization.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" x="48" y="106">PYTHON · PYTORCH · REPRESENTATION ENGINEERING · OPTUNA · SAFETY</text>
      <line x1="48" y1="120" x2="1232" y2="120" stroke="#e5e0d3" stroke-width="1"/>
    </g>
    <!-- Project 02: Nested-Adversarial-Containment -->
    <g transform="translate(0 130)">
      <rect x="48" y="18" width="6" height="24" rx="3" fill="#0284c7"/>
      <text fill="#0b0c10" font-size="18" font-weight="700" x="64" y="36">02 / NESTED-ADVERSARIAL-CONTAINMENT</text>
      <text fill="#5d6270" font-size="13" x="48" y="66">Empirical evaluation framework for multi-agent safety and adversarial breakout dynamics.</text>
      <text fill="#8b909f" font-size="13" x="48" y="86">Stress-tests autonomous containment barriers between interacting LLMs under operational survival pressure.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" x="48" y="106">PYTHON · MULTI-AGENT · AI SAFETY · GAME THEORY · ALIGNMENT</text>
      <line x1="48" y1="120" x2="1232" y2="120" stroke="#e5e0d3" stroke-width="1"/>
    </g>
    <!-- Project 03: ONIX-Council -->
    <g transform="translate(0 250)">
      <rect x="48" y="18" width="6" height="24" rx="3" fill="#0284c7"/>
      <text fill="#0b0c10" font-size="18" font-weight="700" x="64" y="36">03 / ONIX-COUNCIL</text>
      <text fill="#5d6270" font-size="13" x="48" y="66">Collaborative intelligence platform where multiple language models deliberate and reach consensus.</text>
      <text fill="#8b909f" font-size="13" x="48" y="86">Synthesizes distributed multi-perspective reasoning into high-confidence verified outputs via chairman protocol.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" x="48" y="106">PYTHON · LLMS · MULTI-AGENT CONSENSUS · DELIBERATION PROTOCOL</text>
      <line x1="48" y1="120" x2="1232" y2="120" stroke="#e5e0d3" stroke-width="1"/>
    </g>
    <!-- Project 04: CodeCritic -->
    <g transform="translate(0 370)">
      <rect x="48" y="18" width="6" height="24" rx="3" fill="#0284c7"/>
      <text fill="#0b0c10" font-size="18" font-weight="700" x="64" y="36">04 / CODECRITIC</text>
      <text fill="#5d6270" font-size="13" x="48" y="66">Autonomous senior software engineer agent reviewing implementations for architecture quality.</text>
      <text fill="#8b909f" font-size="13" x="48" y="86">Audits pull requests for failure cases, scalability, readability, maintainability, and hidden edge cases.</text>
      <text fill="#0284c7" font-size="11" font-weight="700" x="48" y="106">PYTHON · LLMS · STATIC ANALYSIS · CODE REVIEW AGENT</text>
    </g>
  </g>
</svg>