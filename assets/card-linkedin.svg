<svg viewBox="0 0 1280 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkedIn Card">
  <defs>
    <clipPath id="lic_l"><rect width="1280" height="180" rx="24"/></clipPath>
    <pattern id="grid_li_l" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(11,12,16,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="li_glow_l" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .food-pulse { animation: fp 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes fp { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); } }
    .float-tag { animation: floatTag 3s ease-in-out infinite alternate; }
    @keyframes floatTag { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar, .food-pulse, .float-tag { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#lic_l)">
    <rect width="1280" height="180" fill="#ffffff"/>
    <rect width="1280" height="180" fill="url(#grid_li_l)"/>
    <rect width="1280" height="180" fill="url(#li_glow_l)"/>
    
    <path transform="translate(1120 15) scale(5)" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 1 0 1.6 1.6 1.6 1.6 0 0 0-1.6-1.6Z" fill="#0284c7" opacity="0.12"/>
  </g>
  
  <text x="56" y="52" class="mono" font-size="13" font-weight="700" fill="#0284c7" letter-spacing="3.5">PROFESSIONAL NETWORK · LINKEDIN</text>
  <text x="54" y="104" class="mono" font-size="40" font-weight="700" fill="#0b0c10" letter-spacing="-1">Pranil Shah on LinkedIn</text>
  <text x="56" y="142" class="mono" font-size="15" fill="#5d6270">Connecting with researchers, engineers, and builders in AI safety, cybersecurity &amp; autonomous systems.</text>
  
  <text x="1224" y="52" class="mono" font-size="13" fill="#0284c7" letter-spacing="1" text-anchor="end">in/pranil-shah-721b2033a ↗</text>
  <rect x="0.5" y="0.5" width="1279" height="179" rx="24" fill="none" stroke="rgba(11,12,16,0.09)"/>
</svg>