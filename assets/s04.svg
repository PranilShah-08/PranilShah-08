<svg viewBox="0 0 1280 116" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="04 / STACK — Tools I ship with">
  <defs>
    <linearGradient id="ln_04_l" x1="0" x2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.35" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .food-pulse { animation: fp 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes fp { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); } }
    .float-tag { animation: floatTag 3s ease-in-out infinite alternate; }
    @keyframes floatTag { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar, .food-pulse, .float-tag { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <text x="4" y="34" class="mono" font-size="14" font-weight="700" fill="#0284c7" letter-spacing="4">04 / STACK</text>
  <text x="0" y="86" class="mono" font-size="42" font-weight="700" fill="#0b0c10" letter-spacing="-1">Tools I ship with</text>
  <text x="1276" y="86" class="mono" font-size="16" fill="#5d6270" text-anchor="end">AI/ML, local LLMs, compute engines & security toolchains</text>
  <rect x="0" y="108" width="1280" height="2" fill="url(#ln_04_l)"/>
</svg>