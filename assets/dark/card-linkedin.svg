<svg viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkedIn Connect Card">
  <defs>
    <clipPath id="lic_dark">
      <rect width="1280" height="260" rx="28"/>
    </clipPath>
    <radialGradient id="li_glow" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#0A66C2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="li_glow2" cx="0.9" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#0A66C2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b0e17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_li" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(8px); }
    }
  </style>
  <g clip-path="url(#lic_dark)">
    <rect width="1280" height="260" fill="#0b0e17"/>
    <rect width="1280" height="260" fill="url(#grid_li)"/>
    <rect width="1280" height="260" fill="url(#li_glow)"/>
    <rect width="1280" height="260" fill="url(#li_glow2)"/>
    
    <!-- LinkedIn Icon watermark -->
    <path transform="translate(1080 30) scale(6)" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 1 0 1.6 1.6 1.6 1.6 0 0 0-1.6-1.6Z" fill="#0A66C2" opacity="0.15"/>
  </g>
  
  <text x="64" y="68" class="mono" font-size="13" font-weight="700" fill="#0A66C2" letter-spacing="3.5">PROFESSIONAL NETWORK · CONNECT &amp; ENGAGE</text>
  <text x="60" y="128" class="mono" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-1">Let's connect on LinkedIn.</text>
  <text x="64" y="174" class="mono" font-size="16" fill="#94a3b8">Open to multi-agent alignment research, technical advisory, and engineering opportunities.</text>
  
  <!-- Interactive Button -->
  <g class="sh" transform="translate(64 196)">
    <rect width="260" height="48" rx="24" fill="#0A66C2"/>
    <text x="32" y="30" class="mono" font-size="15" font-weight="700" fill="#ffffff">Connect on LinkedIn</text>
    <path d="M 218 18 l 10 0 m 0 0 l 0 10 m 0 -10 l -12 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="1216" y="68" class="mono" font-size="13" fill="#94a3b8" letter-spacing="2" text-anchor="end">in/pranilshah</text>
  <rect x="0.5" y="0.5" width="1279" height="259" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
</svg>