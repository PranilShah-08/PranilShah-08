<svg viewBox="0 0 1280 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry">
  <defs>
    <clipPath id="tel_cp_d"><rect width="1280" height="330" rx="24"/></clipPath>
    <pattern id="tel_pat_d" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="tel_g_d" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#tel_cp_d)">
    <rect width="1280" height="330" fill="#13141b"/>
    <rect width="1280" height="330" fill="url(#tel_pat_d)"/>
    <rect width="1280" height="330" fill="url(#tel_g_d)"/>

    <line x1="440" y1="44" x2="440" y2="286" stroke="#252736" stroke-width="1"/>
    <line x1="880" y1="44" x2="880" y2="286" stroke="#252736" stroke-width="1"/>

    <!-- Column 1: language distribution -->
    <text fill="#38bdf8" class="mono" x="48" y="60" font-size="11" font-weight="700" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
    <g class="mono" font-size="12">
      <text fill="#f7f0dc" x="48" y="98">python</text>
      <rect class="bar" x="48" y="106" width="310" height="7" rx="3.5" fill="#38bdf8" style="transform-origin:48px 0;"/>
      <text fill="#9aa0ad" x="372" y="113" font-size="11">62%</text>

      <text fill="#f7f0dc" x="48" y="146">c++</text>
      <rect class="bar" x="48" y="154" width="210" height="7" rx="3.5" fill="#f7f0dc" style="transform-origin:48px 0;"/>
      <text fill="#9aa0ad" x="272" y="161" font-size="11">18%</text>

      <text fill="#f7f0dc" x="48" y="194">sql</text>
      <rect class="bar" x="48" y="202" width="150" height="7" rx="3.5" fill="#f7f0dc" style="transform-origin:48px 0;"/>
      <text fill="#9aa0ad" x="212" y="209" font-size="11">11%</text>

      <text fill="#f7f0dc" x="48" y="242">bash · shell</text>
      <rect class="bar" x="48" y="250" width="115" height="7" rx="3.5" fill="#f7f0dc" style="transform-origin:48px 0;"/>
      <text fill="#9aa0ad" x="177" y="257" font-size="11">9%</text>
    </g>

    <!-- Column 2: hardware & compute -->
    <text fill="#38bdf8" class="mono" x="480" y="60" font-size="11" font-weight="700" letter-spacing="2.5">EXECUTION &amp; COMPUTE PROFILES</text>
    <g class="mono">
      <text fill="#f7f0dc" x="480" y="100" font-size="14" font-weight="700">Apple Silicon MPS Native</text>
      <text fill="#9aa0ad" x="480" y="120" font-size="12">Unified memory tensor pipelines &amp; local inference</text>

      <text fill="#f7f0dc" x="480" y="156" font-size="14" font-weight="700">NVIDIA CUDA Acceleration</text>
      <text fill="#9aa0ad" x="480" y="176" font-size="12">High-throughput representation steering clusters</text>

      <text fill="#f7f0dc" x="480" y="212" font-size="14" font-weight="700">Multi-Objective Pareto TPE</text>
      <text fill="#9aa0ad" x="480" y="232" font-size="12">Automated hyperparameter &amp; ablation search</text>

      <text fill="#f7f0dc" x="480" y="268" font-size="14" font-weight="700">Zero-Drift Directional Steering (ARA)</text>
      <text fill="#9aa0ad" x="480" y="288" font-size="12">Hyperspherical row-norm weight invariance</text>
    </g>

    <!-- Column 3: operational metrics -->
    <text fill="#38bdf8" class="mono" x="920" y="60" font-size="11" font-weight="700" letter-spacing="2.5">OPERATIONAL METRICS</text>
    <g class="mono">
      <text fill="#f7f0dc" x="920" y="112" font-size="36" font-weight="700">04</text>
      <text fill="#38bdf8" x="975" y="106" font-size="11" font-weight="700" letter-spacing="1.5">FLAGSHIP</text>
      <text fill="#9aa0ad" x="975" y="122" font-size="11">FRAMEWORKS</text>

      <text fill="#f7f0dc" x="920" y="178" font-size="36" font-weight="700">90+</text>
      <text fill="#38bdf8" x="1005" y="172" font-size="11" font-weight="700" letter-spacing="1.5">TARGET MODELS</text>
      <text fill="#9aa0ad" x="1005" y="188" font-size="11">VERIFIED &amp; TESTED</text>

      <text fill="#38bdf8" x="920" y="242" font-size="28" font-weight="700">ACTIVE</text>
      <text fill="#f7f0dc" x="920" y="266" font-size="11" font-weight="700" letter-spacing="1.5">MULTI-AGENT CONTAINMENT</text>
      <text fill="#9aa0ad" x="920" y="282" font-size="11">SIMULATION SANDBOX</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="329" rx="24" fill="none" stroke="rgba(255,255,255,0.09)"/>
</svg>