<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: languages, hardware, and operational metrics">

  <style>
    :root {
      --bone: #FFFFFF;
      --muted: #888888;
      --dim: #666666;
      --rule: #333333;
      --accent: #CCCCCC;
      --ghost: #222222;
      --ink: #FFFFFF;
      --paper: #000000;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .dot, .ring { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .ring { opacity: 0; }
    }
  </style>
  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="var(--rule)" opacity=".4"/>
  <line x1="688" y1="64" x2="688" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- Column 1: language distribution -->
  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
  <g class="mono" font-size="11">
    <text fill="var(--bone)" x="48" y="108">python</text>
    <rect class="bar a1" x="48" y="116" width="240" height="6" fill="var(--accent)" style="transform-origin:48px 0;"/>
    <text fill="var(--muted)" x="298" y="123" font-size="10">62%</text>

    <text fill="var(--bone)" x="48" y="146">c++</text>
    <rect class="bar a2" x="48" y="154" width="160" height="6" fill="var(--bone)" style="transform-origin:48px 0;"/>
    <text fill="var(--muted)" x="218" y="161" font-size="10">18%</text>

    <text fill="var(--bone)" x="48" y="184">sql</text>
    <rect class="bar a3" x="48" y="192" width="115" height="6" fill="var(--bone)" style="transform-origin:48px 0;"/>
    <text fill="var(--muted)" x="173" y="199" font-size="10">11%</text>

    <text fill="var(--bone)" x="48" y="222">bash · shell</text>
    <rect class="bar a4" x="48" y="230" width="85" height="6" fill="var(--bone)" style="transform-origin:48px 0;"/>
    <text fill="var(--muted)" x="143" y="237" font-size="10">9%</text>
  </g>

  <!-- Column 2: hardware & compute -->
  <text fill="var(--dim)" class="mono" x="388" y="78" font-size="10" letter-spacing="2.5">EXECUTION &amp; COMPUTE PROFILES</text>
  <g class="mono rise a3">
    <text fill="var(--bone)" x="388" y="112" font-size="13" font-weight="700">Apple Silicon MPS Native</text>
    <text fill="var(--muted)" x="388" y="130" font-size="11">Unified memory tensor pipelines</text>

    <text fill="var(--bone)" x="388" y="166" font-size="13" font-weight="700">NVIDIA CUDA Acceleration</text>
    <text fill="var(--muted)" x="388" y="184" font-size="11">High-throughput representation steering</text>

    <text fill="var(--bone)" x="388" y="220" font-size="13" font-weight="700">Multi-Objective Pareto TPE</text>
    <text fill="var(--muted)" x="388" y="238" font-size="11">Optuna automated hyperparameter search</text>

    <text fill="var(--bone)" x="388" y="274" font-size="13" font-weight="700">Zero-Drift Directional Ablation</text>
    <text fill="var(--muted)" x="388" y="292" font-size="11">Arbitrary-rank ablation invariance</text>
  </g>

  <!-- Column 3: operational metrics -->
  <text fill="var(--dim)" class="mono" x="716" y="78" font-size="10" letter-spacing="2.5">SYSTEM METRICS</text>
  <g class="mono rise a4">
    <text fill="var(--bone)" x="716" y="120" font-size="34" font-weight="700">04</text>
    <text fill="var(--muted)" x="765" y="116" font-size="11" letter-spacing="1.5">FLAGSHIP</text>
    <text fill="var(--dim)" x="765" y="130" font-size="10">FRAMEWORKS</text>

    <text fill="var(--bone)" x="716" y="180" font-size="34" font-weight="700">90+</text>
    <text fill="var(--muted)" x="795" y="176" font-size="11" letter-spacing="1.5">TARGET MODELS</text>
    <text fill="var(--dim)" x="795" y="190" font-size="10">VERIFIED &amp; TESTED</text>

    <text fill="var(--bone)" x="716" y="240" font-size="28" font-weight="700">ACTIVE</text>
    <text fill="var(--muted)" x="716" y="260" font-size="11" letter-spacing="1.5">MULTI-AGENT CONTAINMENT</text>
    <text fill="var(--dim)" x="716" y="274" font-size="10">SIMULATION SANDBOX</text>
  </g>
</svg>