<svg viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flagship projects by Pranil Shah">

  <style>
    :root {
      --bone: #FFFFFF;
      --muted: #888888;
      --dim: #666666;
      --rule: #333333;
      --accent: #CCCCCC;
      --ghost: #222222;
      --ink: #FFFFFF;
      --paper: #000000;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .dot, .ring { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .ring { opacity: 0; }
    }
  </style>
  <g class="mono">
    <!-- Project 01 -->
    <g class="rise a1" transform="translate(0 10)">
      <text fill="var(--bone)" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="24">01 / BREAK-YOUR-MODEL</text>
      <text fill="var(--muted)" font-size="12" x="48" y="48">Autonomous LLM representation abliteration &amp; directional safety steering framework.</text>
      <text fill="var(--muted)" font-size="12" x="48" y="66">Zero-drift arbitrary-rank ablation (ARA), hyperspherical row-norm invariance, and Pareto TPE optimization.</text>
      <text fill="var(--accent)" font-size="11" letter-spacing=".4" x="48" y="85">PYTHON · PYTORCH · REPRESENTATION ENGINEERING · OPTUNA · MPS / CUDA</text>
      <line x1="48" y1="102" x2="952" y2="102" stroke="var(--rule)" stroke-width="1"/>
    </g>

    <!-- Project 02 -->
    <g class="rise a2" transform="translate(0 125)">
      <text fill="var(--bone)" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="24">02 / NESTED-ADVERSARIAL-CONTAINMENT</text>
      <text fill="var(--muted)" font-size="12" x="48" y="48">Empirical evaluation framework for multi-agent safety and adversarial breakout dynamics.</text>
      <text fill="var(--muted)" font-size="12" x="48" y="66">Stress-tests autonomous containment barriers between interacting LLMs under operational survival pressure.</text>
      <text fill="var(--accent)" font-size="11" letter-spacing=".4" x="48" y="85">PYTHON · MULTI-AGENT · AI SAFETY · GAME THEORY · ALIGNMENT</text>
      <line x1="48" y1="102" x2="952" y2="102" stroke="var(--rule)" stroke-width="1"/>
    </g>

    <!-- Project 03 -->
    <g class="rise a3" transform="translate(0 240)">
      <text fill="var(--bone)" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="24">03 / ONIX-COUNCIL</text>
      <text fill="var(--muted)" font-size="12" x="48" y="48">Collaborative intelligence platform where multiple language models deliberate and reach consensus.</text>
      <text fill="var(--muted)" font-size="12" x="48" y="66">Synthesizes distributed multi-perspective reasoning into high-confidence verified outputs via chairman protocol.</text>
      <text fill="var(--accent)" font-size="11" letter-spacing=".4" x="48" y="85">PYTHON · LLMS · MULTI-AGENT CONSENSUS · DELIBERATION PROTOCOL</text>
      <line x1="48" y1="102" x2="952" y2="102" stroke="var(--rule)" stroke-width="1"/>
    </g>

    <!-- Project 04 -->
    <g class="rise a4" transform="translate(0 355)">
      <text fill="var(--bone)" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="24">04 / CODECRITIC</text>
      <text fill="var(--muted)" font-size="12" x="48" y="48">Autonomous senior software engineer agent reviewing implementations for architecture quality.</text>
      <text fill="var(--muted)" font-size="12" x="48" y="66">Audits pull requests for failure cases, scalability, readability, maintainability, and hidden edge cases.</text>
      <text fill="var(--accent)" font-size="11" letter-spacing=".4" x="48" y="85">PYTHON · LLMS · STATIC ANALYSIS · CODE REVIEW AGENT</text>
      <line x1="48" y1="102" x2="952" y2="102" stroke="var(--rule)" stroke-width="1"/>
    </g>
  </g>
</svg>