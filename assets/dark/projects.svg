<svg viewBox="0 0 1280 490" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flagship projects by Pranil Shah">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .food-pulse { animation: fp 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes fp { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); } }
    .float-tag { animation: floatTag 3s ease-in-out infinite alternate; }
    @keyframes floatTag { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar, .food-pulse, .float-tag { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="489" rx="24" fill="#13141b" stroke="rgba(255,255,255,0.09)"/>
  <g class="mono">
    <!-- Project 01 -->
    <g transform="translate(0 10)">
      <text fill="#f7f0dc" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">01 / BREAK-YOUR-MODEL</text>
      <text fill="#9aa0ad" font-size="13" x="48" y="52">Autonomous LLM representation abliteration &amp; directional safety steering framework.</text>
      <text fill="#656b7c" font-size="13" x="48" y="72">Zero-drift arbitrary-rank ablation (ARA), hyperspherical row-norm invariance, and Pareto TPE optimization.</text>
      <text fill="#38bdf8" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · PYTORCH · REPRESENTATION ENGINEERING · OPTUNA · VLLM · SAFETY</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#252736" stroke-width="1"/>
    </g>

    <!-- Project 02 -->
    <g transform="translate(0 130)">
      <text fill="#f7f0dc" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">02 / NESTED-ADVERSARIAL-CONTAINMENT</text>
      <text fill="#9aa0ad" font-size="13" x="48" y="52">Empirical evaluation framework for multi-agent safety and adversarial breakout dynamics.</text>
      <text fill="#656b7c" font-size="13" x="48" y="72">Stress-tests autonomous containment barriers between interacting LLMs under operational survival pressure.</text>
      <text fill="#38bdf8" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · MULTI-AGENT · AI SAFETY · GAME THEORY · ALIGNMENT</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#252736" stroke-width="1"/>
    </g>

    <!-- Project 03 -->
    <g transform="translate(0 250)">
      <text fill="#f7f0dc" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">03 / ONIX-COUNCIL</text>
      <text fill="#9aa0ad" font-size="13" x="48" y="52">Collaborative intelligence platform where multiple language models deliberate and reach consensus.</text>
      <text fill="#656b7c" font-size="13" x="48" y="72">Synthesizes distributed multi-perspective reasoning into high-confidence verified outputs via chairman protocol.</text>
      <text fill="#38bdf8" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · LLMS · MULTI-AGENT CONSENSUS · DELIBERATION PROTOCOL</text>
      <line x1="48" y1="110" x2="1232" y2="110" stroke="#252736" stroke-width="1"/>
    </g>

    <!-- Project 04 -->
    <g transform="translate(0 370)">
      <text fill="#f7f0dc" font-size="17" font-weight="700" letter-spacing=".8" x="48" y="26">04 / CODECRITIC</text>
      <text fill="#9aa0ad" font-size="13" x="48" y="52">Autonomous senior software engineer agent reviewing implementations for architecture quality.</text>
      <text fill="#656b7c" font-size="13" x="48" y="72">Audits pull requests for failure cases, scalability, readability, maintainability, and hidden edge cases.</text>
      <text fill="#38bdf8" font-size="11" font-weight="700" letter-spacing=".5" x="48" y="93">PYTHON · LLMS · STATIC ANALYSIS · CODE REVIEW AGENT</text>
    </g>
  </g>
</svg>