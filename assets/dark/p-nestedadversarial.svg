    <text x="44" y="48" class="mono" font-size="20" font-weight="700" fill="#f7f0dc" letter-spacing=".5">02 / NESTED-ADVERSARIAL-CONTAINMENT</text>
    
    <text x="28" y="90" class="mono" font-size="13" fill="#9aa0ad">Empirical evaluation framework for multi-agent safety and adversarial breakout dynamics.</text>
    <text x="28" y="112" class="mono" font-size="13" fill="#656b7c">Stress-tests autonomous containment barriers between interacting LLMs under pressure.</text>
    
    <line x1="28" y1="144" x2="596" y2="144" stroke="#252736" stroke-width="1"/>
    
    <!-- Chips -->
    <rect x="28" y="170" width="75.0" height="28" rx="14" fill="#1c1e2b"/><text x="65.5" y="188" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Python</text><rect x="113.0" y="170" width="117.5" height="28" rx="14" fill="#1c1e2b"/><text x="171.75" y="188" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Multi-Agent</text><rect x="240.5" y="170" width="100.5" height="28" rx="14" fill="#1c1e2b"/><text x="290.75" y="188" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">AI Safety</text><rect x="351.0" y="170" width="117.5" height="28" rx="14" fill="#1c1e2b"/><text x="409.75" y="188" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Game Theory</text>
    
    <!-- Action Line -->
