<svg viewBox="0 0 624 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="02 / NESTED-ADVERSARIAL-CONTAINMENT">
  <defs>
    <clipPath id="pc_02_d"><rect width="624" height="260" rx="24"/></clipPath>
    <pattern id="pc_pat_02_d" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="pc_g_02_d" cx="0.05" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#pc_02_d)">
    <rect width="624" height="260" fill="#13141b"/>
    <rect width="624" height="260" fill="url(#pc_pat_02_d)"/>
    <rect width="624" height="260" fill="url(#pc_g_02_d)"/>
    
    <!-- Accent indicator bar -->
