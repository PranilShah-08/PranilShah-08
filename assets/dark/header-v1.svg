<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pranil Shah — AI/ML Researcher and Developer">

  <style>
    :root {
      --bone: #FFFFFF;
      --muted: #888888;
      --dim: #666666;
      --rule: #333333;
      --accent: #CCCCCC;
      --ghost: #222222;
      --ink: #FFFFFF;
      --paper: #000000;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .dot, .ring { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .ring { opacity: 0; }
    }
  </style>
  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">AHMEDABAD, IN — 23.02° N</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="176" font-size="72" font-weight="700" letter-spacing="-2">Pranil Shah</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="214" font-size="19">AI/ML Researcher &amp; Developer — Ahmedabad, India.</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="274" font-size="12.5" letter-spacing="1">focus  ▸</text>
    <text fill="var(--accent)" class="mono" x="128" y="274" font-size="12.5" letter-spacing="1">multi-agent systems · adversarial containment · representation steering · autonomous LLM councils</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="300" font-size="12.5" letter-spacing="1">open to research collaboration · internships · engineering roles</text>
  </g>

  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">MULTI-AGENT DYNAMICS</text>
    <text fill="var(--accent)" class="mono" x="280" y="374" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="310" y="374" font-size="11.5" letter-spacing="3">REPRESENTATION STEERING</text>
    <text fill="var(--accent)" class="mono" x="600" y="374" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="630" y="374" font-size="11.5" letter-spacing="3">AI SAFETY &amp; CONTAINMENT</text>
    <text fill="var(--muted)" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">2024 / 2028</text>
  </g>
</svg>