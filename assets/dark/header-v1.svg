<svg viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pranil Shah Hero Banner">
  <defs>
    <clipPath id="h_cp_d"><rect width="1280" height="340" rx="28"/></clipPath>
    <pattern id="h_pat_d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="h_g1_d" cx="0.08" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_g2_d" cx="0.92" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#h_cp_d)">
    <rect width="1280" height="340" fill="#13141b"/>
    <rect width="1280" height="340" fill="url(#h_pat_d)"/>
    <rect width="1280" height="340" fill="url(#h_g1_d)"/>
    <rect width="1280" height="340" fill="url(#h_g2_d)"/>
    
    <!-- Top Meta Line: Pune, IN — 18.52° N -->
    <text x="56" y="52" class="mono" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="4">PORTFOLIO — INDEX Nº 001</text>
    <text x="1224" y="52" class="mono" font-size="13" fill="#9aa0ad" letter-spacing="2" text-anchor="end">PUNE, IN — 18.52° N</text>
    <line x1="56" y1="68" x2="1224" y2="68" stroke="#252736" stroke-width="1"/>

    <!-- Main Title -->
    <text x="54" y="152" class="mono" font-size="68" font-weight="700" fill="#f7f0dc" letter-spacing="-2">Pranil Shah</text>
    <text x="56" y="194" class="mono" font-size="20" fill="#9aa0ad">AI/ML Researcher &amp; Developer — Multi-Agent Systems &amp; Alignment</text>
    <text x="56" y="234" class="mono" font-size="14" fill="#656b7c">focus  ▸  multi-agent dynamics · adversarial containment · representation steering · autonomous councils</text>
    
    <!-- Chip Tags: No MPS/CUDA, replaced with LLM Containment -->
    <g transform="translate(56 262)">
      <rect width="185" height="32" rx="16" fill="#1c1e2b"/>
      <text x="92" y="21" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Multi-Agent Systems</text>
      
      <rect x="195" width="200" height="32" rx="16" fill="#1c1e2b"/>
      <text x="295" y="21" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Representation Steering</text>
      
      <rect x="405" width="185" height="32" rx="16" fill="#1c1e2b"/>
      <text x="497" y="21" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Adversarial Safety</text>
      
      <rect x="600" width="175" height="32" rx="16" fill="#1c1e2b"/>
      <text x="687" y="21" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">LLM Containment</text>
    </g>

    <text x="1224" y="284" class="mono" font-size="13" fill="#9aa0ad" letter-spacing="2" text-anchor="end">PUNE, INDIA · 2024 / 2028</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="28" fill="none" stroke="rgba(255,255,255,0.09)"/>
</svg>