<svg viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, domains">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pulse-ring { animation: ring 2.2s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .pulse-dot, .pulse-ring, .sh { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .pulse-ring { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="239" rx="24" fill="#13141b" stroke="rgba(255,255,255,0.08)"/>
  
  <text class="mono rise a1" x="48" y="36" font-size="16" fill="#f7f0dc">AI/ML student and developer exploring autonomous agent dynamics &amp; model safety.</text>
  <text class="mono rise a2" x="48" y="66" font-size="16" fill="#f7f0dc">Researching multi-agent containment, representation steering, and deliberative consensus.</text>
  <text class="mono rise a3" x="48" y="96" font-size="15" fill="#9aa0ad">Bridging mechanistic interpretability with resilient, production-grade agent architectures.</text>

  <line class="rise a4" x1="48" y1="126" x2="1232" y2="126" stroke="#262837" stroke-width="1"/>

  <text class="mono rise a4" x="48"  y="158" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="160" y="158" font-size="15" fill="#f7f0dc">Multi-Agent Systems &amp; Containment · Representation Steering &amp; Ablation · Autonomous Tool-Use</text>

  <text class="mono rise a5" x="48"  y="192" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="160" y="192" font-size="15" fill="#9aa0ad">open to research collaboration · internships · engineering roles</text>

  <text class="mono rise a6" x="48"  y="224" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5">DOMAINS</text>
  <text class="mono rise a6" x="160" y="224" font-size="15" fill="#f7f0dc">AI Alignment · Autonomous Decision Matrices · Safety Benchmarking</text>
</svg>