<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, domains">

  <style>
    :root {
      --bone: #FFFFFF;
      --muted: #888888;
      --dim: #666666;
      --rule: #333333;
      --accent: #CCCCCC;
      --ghost: #222222;
      --ink: #FFFFFF;
      --paper: #000000;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .dot, .ring { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .ring { opacity: 0; }
    }
  </style>
  <text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--bone)">ai/ml student and developer exploring autonomous agent dynamics &amp; model safety.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--bone)">researching multi-agent containment, representation steering, and deliberative consensus.</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="var(--muted)">bridging mechanistic interpretability with resilient, production-grade agent systems.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="var(--bone)">Multi-Agent Systems &amp; Containment · Representation Steering &amp; Ablation · Autonomous Tool-Use</text>

  <text class="mono rise a5" x="48"  y="182" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="var(--accent)">open to research collaboration · internships · engineering roles</text>

  <text class="mono rise a6" x="48"  y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">DOMAINS</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="var(--bone)">AI Alignment · Autonomous Decision Matrices · Safety Benchmarking</text>
</svg>