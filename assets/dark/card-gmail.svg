<svg viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gmail Dispatch Card">
  <defs>
    <clipPath id="gmc_dark">
      <rect width="1280" height="260" rx="28"/>
    </clipPath>
    <radialGradient id="gm_glow" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#EA4335" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#120b0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gm_glow2" cx="0.9" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#EA4335" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#120b0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_gm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(8px); }
    }
  </style>
  <g clip-path="url(#gmc_dark)">
    <rect width="1280" height="260" fill="#120b0c"/>
    <rect width="1280" height="260" fill="url(#grid_gm)"/>
    <rect width="1280" height="260" fill="url(#gm_glow)"/>
    <rect width="1280" height="260" fill="url(#gm_glow2)"/>
    
    <!-- Mail Icon watermark -->
    <path transform="translate(1080 30) scale(6)" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#EA4335" opacity="0.15"/>
  </g>
  
  <text x="64" y="68" class="mono" font-size="13" font-weight="700" fill="#EA4335" letter-spacing="3.5">DIRECT DISPATCH · INBOX</text>
  <text x="60" y="128" class="mono" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-1">pranilshah08@gmail.com</text>
  <text x="64" y="174" class="mono" font-size="16" fill="#94a3b8">Drop a line for research discussions, collaboration proposals, or confidential inquiries.</text>
  
  <!-- Interactive Button -->
  <g class="sh" transform="translate(64 196)">
    <rect width="230" height="48" rx="24" fill="#EA4335"/>
    <text x="32" y="30" class="mono" font-size="15" font-weight="700" fill="#ffffff">Send an Email</text>
    <path d="M 190 18 l 10 0 m 0 0 l 0 10 m 0 -10 l -12 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="1216" y="68" class="mono" font-size="13" fill="#94a3b8" letter-spacing="2" text-anchor="end">SLA: &lt; 24 HOURS</text>
  <rect x="0.5" y="0.5" width="1279" height="259" rx="28" fill="none" stroke="rgba(255,255,255,0.12)"/>
</svg>