<svg viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gmail Dispatch Card">
  <defs>
    <clipPath id="gmc_d"><rect width="1280" height="240" rx="24"/></clipPath>
    <pattern id="grid_gm_d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gm_glow_d" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pulse-ring { animation: ring 2.2s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .bar, .pulse-dot, .pulse-ring, .sh { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      .pulse-ring { opacity: 0; }
    }
  </style>

  <g clip-path="url(#gmc_d)">
    <rect width="1280" height="240" fill="#13141b"/>
    <rect width="1280" height="240" fill="url(#grid_gm_d)"/>
    <rect width="1280" height="240" fill="url(#gm_glow_d)"/>
    
    <path transform="translate(1080 20) scale(6)" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#38bdf8" opacity="0.12"/>
  </g>
  
  <text x="56" y="58" class="mono" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="3.5">DIRECT DISPATCH · INBOX</text>
  <text x="54" y="112" class="mono" font-size="40" font-weight="700" fill="#f7f0dc" letter-spacing="-1">pranilshah08@gmail.com</text>
  <text x="56" y="152" class="mono" font-size="15" fill="#9aa0ad">Drop a note for research inquiries, collaboration proposals, or technical discussions.</text>
  
  <g class="sh" transform="translate(56 172)">
    <rect width="220" height="46" rx="23" fill="#38bdf8"/>
    <text x="28" y="29" class="mono" font-size="14" font-weight="700" fill="#13141b">Send an Email</text>
    <path d="M 178 17 l 10 0 m 0 0 l 0 10 m 0 -10 l -12 12" stroke="#13141b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="1224" y="58" class="mono" font-size="13" fill="#686e7d" letter-spacing="2" text-anchor="end">SLA: &lt; 24 HOURS</text>
  <rect x="0.5" y="0.5" width="1279" height="239" rx="24" fill="none" stroke="rgba(255,255,255,0.08)"/>
</svg>