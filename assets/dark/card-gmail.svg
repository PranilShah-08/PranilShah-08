<svg viewBox="0 0 1280 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gmail Dispatch Card">
  <defs>
    <clipPath id="gmc_d"><rect width="1280" height="180" rx="24"/></clipPath>
    <pattern id="grid_gm_d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gm_glow_d" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#13141b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#gmc_d)">
    <rect width="1280" height="180" fill="#13141b"/>
    <rect width="1280" height="180" fill="url(#grid_gm_d)"/>
    <rect width="1280" height="180" fill="url(#gm_glow_d)"/>
    
    <path transform="translate(1120 15) scale(5)" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#38bdf8" opacity="0.12"/>
  </g>
  
  <text x="56" y="52" class="mono" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="3.5">DIRECT DISPATCH · INBOX</text>
  <text x="54" y="104" class="mono" font-size="40" font-weight="700" fill="#f7f0dc" letter-spacing="-1">pranilshah08@gmail.com</text>
  <text x="56" y="142" class="mono" font-size="15" fill="#9aa0ad">Drop a line for research discussions, technical inquiries, or correspondence.</text>
  
  <text x="1224" y="52" class="mono" font-size="13" fill="#656b7c" letter-spacing="2" text-anchor="end">SLA: &lt; 24 HOURS</text>
  <rect x="0.5" y="0.5" width="1279" height="179" rx="24" fill="none" stroke="rgba(255,255,255,0.09)"/>
</svg>