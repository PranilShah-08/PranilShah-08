  <text x="1276" y="86" class="mono" font-size="16" fill="#9aa0ad" text-anchor="end">AI safety, alignment & multi-agent systems</text>
  <rect x="0" y="108" width="1280" height="2" fill="url(#ln_06_d)"/>
