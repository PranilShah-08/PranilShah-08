<svg viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami card">
  <defs>
    <clipPath id="w_cp_l"><rect width="1280" height="260" rx="24"/></clipPath>
    <pattern id="w_pat_l" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(11,12,16,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="w_glow_l" cx="0.05" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#w_cp_l)">
    <rect width="1280" height="260" fill="#ffffff"/>
    <rect width="1280" height="260" fill="url(#w_pat_l)"/>
    <rect width="1280" height="260" fill="url(#w_glow_l)"/>

    <text class="mono" x="48" y="44" font-size="17" font-weight="700" fill="#0b0c10">AI/ML student and developer exploring autonomous agent dynamics &amp; model safety.</text>
    <text class="mono" x="48" y="74" font-size="16" fill="#5d6270">Researching multi-agent containment, representation steering, and deliberative consensus protocols.</text>
    <text class="mono" x="48" y="104" font-size="15" fill="#8b909f">Bridging mechanistic interpretability with resilient, production-grade autonomous agent architectures.</text>

    <line x1="48" y1="134" x2="1232" y2="134" stroke="#e5e0d3" stroke-width="1"/>

    <!-- 3 Attribute Blocks (Victor Studios style) -->
    <g transform="translate(48 154)">
      <rect width="360" height="76" rx="16" fill="#f4efe3" stroke="rgba(11,12,16,0.09)"/>
      <text x="20" y="32" class="mono" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="2">CORE FOCUS</text>
      <text x="20" y="56" class="mono" font-size="14" fill="#0b0c10">Multi-Agent Safety &amp; Steering</text>
    </g>

    <g transform="translate(432 154)">
      <rect width="360" height="76" rx="16" fill="#f4efe3" stroke="rgba(11,12,16,0.09)"/>
      <text x="20" y="32" class="mono" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="2">CURRENT STATUS</text>
      <text x="20" y="56" class="mono" font-size="14" fill="#0b0c10">Open for Research &amp; Advisory</text>
    </g>

    <g transform="translate(816 154)">
      <rect width="416" height="76" rx="16" fill="#f4efe3" stroke="rgba(11,12,16,0.09)"/>
      <text x="20" y="32" class="mono" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="2">LOCATION &amp; BASE</text>
      <text x="20" y="56" class="mono" font-size="14" fill="#0b0c10">Ahmedabad, India · 23.02° N</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="259" rx="24" fill="none" stroke="rgba(11,12,16,0.09)"/>
</svg>