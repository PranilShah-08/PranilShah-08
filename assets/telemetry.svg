<svg viewBox="0 0 1280 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: languages, compute profiles, and metrics">
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .food-pulse { animation: fp 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes fp { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); } }
    .float-tag { animation: floatTag 3s ease-in-out infinite alternate; }
    @keyframes floatTag { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .bar, .food-pulse, .float-tag { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="329" rx="24" fill="#ffffff" stroke="rgba(11,12,16,0.09)"/>
  
  <line x1="440" y1="44" x2="440" y2="286" stroke="#e5e0d3" stroke-width="1"/>
  <line x1="880" y1="44" x2="880" y2="286" stroke="#e5e0d3" stroke-width="1"/>

  <!-- Column 1: language distribution -->
  <text fill="#0284c7" class="mono" x="48" y="60" font-size="11" font-weight="700" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
  <g class="mono" font-size="12">
    <text fill="#0b0c10" x="48" y="98">python</text>
    <rect class="bar" x="48" y="106" width="310" height="7" rx="3.5" fill="#0284c7" style="transform-origin:48px 0;"/>
    <text fill="#5d6270" x="372" y="113" font-size="11">62%</text>

    <text fill="#0b0c10" x="48" y="146">c++</text>
    <rect class="bar" x="48" y="154" width="210" height="7" rx="3.5" fill="#0b0c10" style="transform-origin:48px 0;"/>
    <text fill="#5d6270" x="272" y="161" font-size="11">18%</text>

    <text fill="#0b0c10" x="48" y="194">sql</text>
    <rect class="bar" x="48" y="202" width="150" height="7" rx="3.5" fill="#0b0c10" style="transform-origin:48px 0;"/>
    <text fill="#5d6270" x="212" y="209" font-size="11">11%</text>

    <text fill="#0b0c10" x="48" y="242">bash · shell</text>
    <rect class="bar" x="48" y="250" width="115" height="7" rx="3.5" fill="#0b0c10" style="transform-origin:48px 0;"/>
    <text fill="#5d6270" x="177" y="257" font-size="11">9%</text>
  </g>

  <!-- Column 2: hardware & compute -->
  <text fill="#0284c7" class="mono" x="480" y="60" font-size="11" font-weight="700" letter-spacing="2.5">EXECUTION &amp; COMPUTE PROFILES</text>
  <g class="mono">
    <text fill="#0b0c10" x="480" y="100" font-size="14" font-weight="700">Local LLM &amp; Quantized Runtimes</text>
    <text fill="#5d6270" x="480" y="120" font-size="12">Ollama &amp; LM Studio low-latency inference orchestration</text>

    <text fill="#0b0c10" x="480" y="164" font-size="14" font-weight="700">High-Concurrency Agent Runtime</text>
    <text fill="#5d6270" x="480" y="184" font-size="12">Multi-agent arbitration, memory vectors &amp; async dispatch</text>

    <text fill="#0b0c10" x="480" y="228" font-size="14" font-weight="700">Adversarial Safety Containment</text>
    <text fill="#5d6270" x="480" y="248" font-size="12">Zero-drift representation engineering &amp; network security</text>
  </g>

  <!-- Column 3: metrics counter -->
  <text fill="#0284c7" class="mono" x="920" y="60" font-size="11" font-weight="700" letter-spacing="2.5">KEY TELEMETRY METRICS</text>
  <g class="mono">
    <text fill="#0b0c10" font-size="36" font-weight="700" x="920" y="112">04</text>
    <text fill="#5d6270" font-size="12" x="980" y="104">Flagship Frameworks</text>
    <text fill="#8b909f" font-size="11" x="980" y="120">active research repos</text>

    <text fill="#0b0c10" font-size="36" font-weight="700" x="920" y="176">100%</text>
    <text fill="#5d6270" font-size="12" x="1030" y="168">Open Source Focus</text>
    <text fill="#8b909f" font-size="11" x="1030" y="184">verifiable codebases</text>

    <text fill="#0b0c10" font-size="36" font-weight="700" x="920" y="240">99.8%</text>
    <text fill="#5d6270" font-size="12" x="1050" y="232">Containment Fidelity</text>
    <text fill="#8b909f" font-size="11" x="1050" y="248">zero-drift steering benchmark</text>
  </g>
</svg>