<svg viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pranil Shah Hero Banner">
  <defs>
    <clipPath id="h_cp_l"><rect width="1280" height="360" rx="28"/></clipPath>
    <pattern id="h_pat_l" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(11,12,16,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="h_g1_l" cx="0.08" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_g2_l" cx="0.92" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#h_cp_l)">
    <rect width="1280" height="360" fill="#ffffff"/>
    <rect width="1280" height="360" fill="url(#h_pat_l)"/>
    <rect width="1280" height="360" fill="url(#h_g1_l)"/>
    <rect width="1280" height="360" fill="url(#h_g2_l)"/>
    
    <!-- Top Meta Line -->
    <text x="56" y="52" class="mono" font-size="13" font-weight="700" fill="#0284c7" letter-spacing="4">PORTFOLIO — INDEX Nº 001</text>
    <text x="1224" y="52" class="mono" font-size="13" fill="#5d6270" letter-spacing="2" text-anchor="end">AHMEDABAD, IN — 23.02° N</text>
    <line x1="56" y1="68" x2="1224" y2="68" stroke="#e5e0d3" stroke-width="1"/>

    <!-- Main Title -->
    <text x="54" y="152" class="mono" font-size="68" font-weight="700" fill="#0b0c10" letter-spacing="-2">Pranil Shah</text>
    <text x="56" y="194" class="mono" font-size="20" fill="#5d6270">AI/ML Researcher &amp; Developer — Multi-Agent Systems &amp; Alignment</text>
    <text x="56" y="240" class="mono" font-size="14" fill="#8b909f">focus  ▸  multi-agent dynamics · adversarial containment · representation steering · autonomous councils</text>
    
    <!-- Chip Tags -->
    <g transform="translate(56 270)">
      <rect width="180" height="32" rx="16" fill="#f1ebe0"/>
      <text x="90" y="21" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Multi-Agent Systems</text>
      
      <rect x="190" width="195" height="32" rx="16" fill="#f1ebe0"/>
      <text x="287" y="21" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Representation Steering</text>
      
      <rect x="395" width="180" height="32" rx="16" fill="#f1ebe0"/>
      <text x="485" y="21" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Adversarial Safety</text>
      
      <rect x="585" width="165" height="32" rx="16" fill="#f1ebe0"/>
      <text x="667" y="21" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Apple MPS · CUDA</text>
    </g>

    <text x="1224" y="292" class="mono" font-size="13" fill="#5d6270" letter-spacing="2" text-anchor="end">OPEN TO COLLABORATION · 2024 / 2028</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="rgba(11,12,16,0.09)"/>
</svg>