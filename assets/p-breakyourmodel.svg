<svg viewBox="0 0 624 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="01 / BREAK-YOUR-MODEL">
  <defs>
    <clipPath id="pc_01_l"><rect width="624" height="260" rx="24"/></clipPath>
    <pattern id="pc_pat_01_l" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(11,12,16,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="pc_g_01_l" cx="0.05" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sh { animation: sh 2.8s ease-in-out infinite; }
    @keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .pulse-dot { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sh, .pulse-dot, .bar { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#pc_01_l)">
    <rect width="624" height="260" fill="#ffffff"/>
    <rect width="624" height="260" fill="url(#pc_pat_01_l)"/>
    <rect width="624" height="260" fill="url(#pc_g_01_l)"/>
    
    <!-- Accent indicator bar -->
    <rect x="28" y="28" width="6" height="26" rx="3" fill="#0284c7"/>
    <text x="44" y="48" class="mono" font-size="20" font-weight="700" fill="#0b0c10" letter-spacing=".5">01 / BREAK-YOUR-MODEL</text>
    
    <text x="28" y="90" class="mono" font-size="13" fill="#5d6270">Autonomous LLM representation abliteration & directional safety steering framework.</text>
    <text x="28" y="112" class="mono" font-size="13" fill="#8b909f">Zero-drift arbitrary-rank ablation (ARA), hyperspherical norm invariance & Pareto TPE.</text>
    
    <line x1="28" y1="144" x2="596" y2="144" stroke="#e5e0d3" stroke-width="1"/>
    
    <!-- Chips -->
    <rect x="28" y="170" width="75.0" height="28" rx="14" fill="#f1ebe0"/><text x="65.5" y="188" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Python</text><rect x="113.0" y="170" width="83.5" height="28" rx="14" fill="#f1ebe0"/><text x="154.75" y="188" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">PyTorch</text><rect x="206.5" y="170" width="100.5" height="28" rx="14" fill="#f1ebe0"/><text x="256.75" y="188" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">AI Safety</text><rect x="317.0" y="170" width="75.0" height="28" rx="14" fill="#f1ebe0"/><text x="354.5" y="188" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">Optuna</text><rect x="402.0" y="170" width="109.0" height="28" rx="14" fill="#f1ebe0"/><text x="456.5" y="188" class="mono" font-size="12" fill="#1e293b" text-anchor="middle">MPS / CUDA</text>
    
    <!-- Action Line -->
    <g class="sh" transform="translate(434 214)">
      <text x="0" y="20" class="mono" font-size="13" font-weight="700" fill="#0284c7">Explore Repository</text>
      <path d="M 152 10 l 8 0 m 0 0 l 0 8 m 0 -8 l -10 10" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="623" height="259" rx="24" fill="none" stroke="rgba(11,12,16,0.09)"/>
</svg>